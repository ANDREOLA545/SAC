<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Model Codes Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Layout */
    --bg:           #f4f6fa;
    --surface:      #ffffff;
    --border:       #d1d9e6;
    --border-dark:  #b0bcd4;
    --shadow:       0 2px 12px rgba(0,0,0,0.08);

    /* Typography */
    --font-sans: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --text-primary:   #1a2233;
    --text-secondary: #4a5568;
    --text-muted:     #8a9ab5;

    /* Header */
    --header-bg:    #1a3a5c;
    --header-text:  #e8f0fb;
    --subheader-bg: #2d5f9a;

    /* Text color codes */
    --txt-1: #c0392b;   /* Código Texto = 1 → rojo */
    --txt-2: #1a6bb5;   /* Código Texto = 2 → azul */
    --txt-3: #1e8449;   /* Código Texto = 3 → verde */
    --txt-default: #1a2233;

    /* Background color codes */
    --bg-2: #e8ecf0;    /* Código Fondo = 2 → gris */
    --bg-4: #fde8e8;    /* Código Fondo = 4 → rojo claro */
    --bg-default: #ffffff;

    /* Row stripes */
    --row-odd:  #ffffff;
    --row-even: #f7f9fc;
  }

  body {
    background: var(--bg);
    font-family: var(--font-sans);
    padding: 20px;
    color: var(--text-primary);
  }

  /* ── Widget header ── */
  .widget-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .widget-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .widget-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    margin-top: 2px;
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .legend-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .legend-group-title {
    font-size: 9px;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .legend-items { display: flex; gap: 8px; flex-wrap: wrap; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .legend-swatch {
    width: 14px; height: 10px; border-radius: 2px; border: 1px solid var(--border-dark); flex-shrink: 0;
  }
  .ld-txt1 { background: var(--txt-1); }
  .ld-txt2 { background: var(--txt-2); }
  .ld-txt3 { background: var(--txt-3); }
  .ld-bg2  { background: var(--bg-2); }
  .ld-bg4  { background: var(--bg-4); border-color: #e8a0a0; }

  /* ── Table wrapper ── */
  .table-wrapper {
    overflow-x: auto;
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 700px;
  }

  /* ── Column headers ── */
  thead tr.header-row-1 th {
    background: var(--header-bg);
    color: var(--header-text);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 9px 10px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.12);
    white-space: nowrap;
  }
  thead tr.header-row-1 th.dim-header {
    text-align: left;
    border-right: 2px solid rgba(255,255,255,0.25);
  }
  thead tr.header-row-2 th {
    background: var(--subheader-bg);
    color: var(--header-text);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    padding: 6px 10px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.1);
    border-bottom: 2px solid var(--border-dark);
    white-space: nowrap;
  }
  thead tr.header-row-2 th.dim-header {
    text-align: left;
    border-right: 2px solid rgba(255,255,255,0.25);
    font-size: 10px;
  }

  /* ── Body rows ── */
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:nth-child(odd)  { background: var(--row-odd); }
  tbody tr:nth-child(even) { background: var(--row-even); }
  tbody tr:hover { background: #eef3fb !important; }
  tbody tr:last-child { border-bottom: none; }

  /* ── Dimension cells (left columns) ── */
  td.dim-cell {
    padding: 8px 10px;
    font-size: 12px;
    white-space: nowrap;
    border-right: 2px solid var(--border);
    color: var(--text-primary);
    font-family: var(--font-sans);
  }
  td.dim-cell.material {
    font-weight: 600;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--header-bg);
    min-width: 100px;
  }
  td.dim-cell.date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    min-width: 90px;
  }
  td.dim-cell.frozen {
    font-family: var(--font-mono);
    font-size: 11px;
    min-width: 90px;
  }
  td.dim-cell.frozen.frozen-active {
    color: var(--txt-1);
    font-weight: 500;
  }

  /* ── Quantity cells ── */
  td.qty-cell {
    padding: 0;
    text-align: right;
    border-right: 1px solid var(--border);
    min-width: 90px;
    position: relative;
  }
  td.qty-cell:last-child { border-right: none; }

  .qty-inner {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 8px 10px;
    height: 100%;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    transition: filter 0.12s;
    /* background and color set dynamically */
  }
  .qty-inner.empty {
    color: var(--text-muted);
    font-weight: 400;
  }

  /* ── Tooltip ── */
  .tooltip {
    position: fixed;
    background: #1a2233;
    border: 1px solid #2d3a52;
    border-radius: 6px;
    padding: 9px 13px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: #e8f0fb;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.12s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    white-space: nowrap;
  }
  .tooltip.visible { opacity: 1; }
  .tt-title { color: #8a9ab5; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .tt-row { display: flex; gap: 10px; margin-bottom: 3px; }
  .tt-label { color: #6b7c99; min-width: 90px; }
  .tt-value { font-weight: 500; }
  .tt-red   { color: #e87070; }
  .tt-blue  { color: #6baee8; }
  .tt-green { color: #5dbf7a; }
  .tt-gray  { color: #8a9ab5; }

  /* ── State message ── */
  .state-msg {
    display: flex; align-items: center; justify-content: center;
    height: 100px; font-family: var(--font-mono); font-size: 11px;
    color: var(--text-muted); letter-spacing: 0.1em;
  }
  .state-msg.error { color: var(--txt-1); }

  /* ── Footer ── */
  .widget-footer {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    flex-wrap: wrap;
    gap: 4px;
  }
</style>
</head>
<body>

<div class="widget-header">
  <div>
    <div class="widget-title">Model Codes — Delivery View</div>
    <div class="widget-subtitle">Quantity · text color by Código Texto · bg color by Código Fondo</div>
  </div>
  <div class="legend">
    <div class="legend-group">
      <div class="legend-group-title">Texto (color)</div>
      <div class="legend-items">
        <div class="legend-item"><div class="legend-dot ld-txt1"></div>Código 1</div>
        <div class="legend-item"><div class="legend-dot ld-txt2"></div>Código 2</div>
        <div class="legend-item"><div class="legend-dot ld-txt3"></div>Código 3</div>
      </div>
    </div>
    <div class="legend-group">
      <div class="legend-group-title">Fondo</div>
      <div class="legend-items">
        <div class="legend-item"><div class="legend-swatch ld-bg2"></div>Código 2</div>
        <div class="legend-item"><div class="legend-swatch ld-bg4"></div>Código 4</div>
      </div>
    </div>
  </div>
</div>

<div id="stateMsg" class="state-msg">Loading data…</div>

<div id="tableWrapper" class="table-wrapper" style="display:none;">
  <table id="mainTable">
    <thead>
      <tr class="header-row-1" id="headerRow1"></tr>
      <tr class="header-row-2" id="headerRow2"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="widget-footer">
  <span>SAC Custom Widget · Model Codes</span>
  <span id="footerSummary"></span>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  SAC CUSTOM WIDGET — Model Codes Delivery View
//  Compatible with: SAP Analytics Cloud — Optimized Stories
//
//  DATA BINDING (configure in Widget Builder):
//
//  Feed name          Description                       Type
//  ─────────────────────────────────────────────────────────────
//  feed_material      Material (dimension)              Dimension
//  feed_fecha         Fecha Entrega (dimension)         Dimension
//  feed_docdate       Document Date (dimension)         Dimension
//  feed_frozen        Frozen End (dimension)            Dimension
//  feed_yearmonth     Calendar Year/Month (dimension)   Dimension  ← column axis
//  feed_qty           Quantity (measure)                Measure
//  feed_cod_texto     Código Texto (dimension)          Dimension  values: 1 | 2 | 3
//  feed_cod_fondo     Código Fondo (dimension)          Dimension  values: 2 | 4
//
//  NOTE: All feeds must be aligned by row (SAC aligns by position).
//        feed_yearmonth is the column-grouping dimension.
// ═══════════════════════════════════════════════════════════════

// ── Color maps (edit here to change palette) ──────────────────
const TEXT_COLOR = {
  '1': '#c0392b',   // rojo
  '2': '#1a6bb5',   // azul
  '3': '#1e8449',   // verde
};
const BG_COLOR = {
  '2': '#e8ecf0',   // gris
  '4': '#fde8e8',   // rojo claro
};
const DEFAULT_TEXT = '#1a2233';
const DEFAULT_BG   = 'transparent';

// ── Internal state ─────────────────────────────────────────────
let _rows      = [];   // normalized flat rows
let _periods   = [];   // unique year/month labels in order
let _rowGroups = [];   // grouped by (material, fecha, docdate, frozen)

// ═══════════════════════════════════════════════════════════════
//  SAC LIFECYCLE HOOKS
// ═══════════════════════════════════════════════════════════════

function onCustomWidgetBeforeUpdate(changedProperties) {
  showState('Loading…', false);
}

function onCustomWidgetAfterUpdate(changedProperties) {
  try {
    const feeds = typeof dataBinding !== 'undefined' ? dataBinding : null;
    if (!feeds) { loadDemoData(); return; }

    const rows = extractRows(feeds);
    if (!rows || rows.length === 0) {
      showState('Sin datos. Verifica el data binding y los filtros aplicados.', true);
      return;
    }
    processRows(rows);
    renderTable();
  } catch (err) {
    console.error('[ModelCodesWidget]', err);
    showState('Error: ' + err.message, true);
  }
}

// ═══════════════════════════════════════════════════════════════
//  DATA EXTRACTION
// ═══════════════════════════════════════════════════════════════

function extractRows(feeds) {
  // SAC passes a single dataBinding object: feeds = dataBinding.myDataBinding
  // Rows are in feeds.data[], each row keyed by feed alias + "_N" index
  // e.g. row.feed_material_0, row.feed_yearmonth_0, row.feed_qty_0

  // Support both single-binding (myDataBinding) and multi-binding legacy structure
  const binding = feeds.myDataBinding ?? feeds;
  const data = binding.data ?? binding;

  if (!data || !Array.isArray(data)) throw new Error('No data array found in dataBinding');
  if (data.length === 0) return [];

  // Detect feed key pattern from first row
  const firstRow = data[0];
  const keys = Object.keys(firstRow);

  // Helper: find feed value by id prefix in row
  function feedVal(row, feedId) {
    const key = keys.find(k => k.startsWith(feedId));
    return key ? row[key] : undefined;
  }

  const rows = [];
  for (const row of data) {
    const qtyItem = feedVal(row, 'feed_qty');
    rows.push({
      material:  getLabel(feedVal(row, 'feed_material')),
      fecha:     getLabel(feedVal(row, 'feed_fecha')),
      docDate:   getLabel(feedVal(row, 'feed_docdate')),
      frozen:    getLabel(feedVal(row, 'feed_frozen')),
      yearMonth: getLabel(feedVal(row, 'feed_yearmonth')),
      qty:       qtyItem?.rawValue ?? qtyItem?.raw ?? null,
      codTexto:  String(getLabel(feedVal(row, 'feed_cod_texto'))).trim(),
      codFondo:  String(getLabel(feedVal(row, 'feed_cod_fondo'))).trim(),
    });
  }
  return rows;
}

function getFeedData(feeds, name) {
  const f = feeds[name];
  if (!f) return null;
  if (Array.isArray(f)) return f;
  if (f.data && Array.isArray(f.data)) return f.data;
  return null;
}

function getLabel(item) {
  if (!item && item !== 0) return '';
  if (typeof item === 'string' || typeof item === 'number') return String(item);
  return item.label ?? item.id ?? item.formattedValue ?? item.rawValue ?? '';
}

// ═══════════════════════════════════════════════════════════════
//  DATA PROCESSING
//  Groups rows by (material, fecha, docDate, frozen)
//  and pivots yearMonth into columns.
// ═══════════════════════════════════════════════════════════════

function processRows(rows) {
  _rows = rows;

  // Collect unique periods in the order they appear
  const periodSet = new Map();
  rows.forEach(r => { if (!periodSet.has(r.yearMonth)) periodSet.set(r.yearMonth, periodSet.size); });
  _periods = [...periodSet.keys()];

  // Group rows by composite key
  const groupMap = new Map();
  rows.forEach(r => {
    const key = [r.material, r.fecha, r.docDate, r.frozen].join('||');
    if (!groupMap.has(key)) {
      groupMap.set(key, {
        material: r.material,
        fecha:    r.fecha,
        docDate:  r.docDate,
        frozen:   r.frozen,
        cells: {}   // yearMonth → { qty, codTexto, codFondo }
      });
    }
    groupMap.get(key).cells[r.yearMonth] = {
      qty:      r.qty,
      codTexto: r.codTexto,
      codFondo: r.codFondo,
    };
  });

  _rowGroups = [...groupMap.values()];
}

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════

function renderTable() {
  if (_rowGroups.length === 0) { showState('Sin datos.', false); return; }
  hideState();

  // ── Header row 1: dimension labels + "Measures" spanning periods ──
  const hr1 = document.getElementById('headerRow1');
  const hr2 = document.getElementById('headerRow2');
  hr1.innerHTML = '';
  hr2.innerHTML = '';

  const DIM_HEADERS = ['Material', 'Fecha Entrega', 'Document Date', 'Frozen End'];

  // Row 1
  DIM_HEADERS.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    th.className = 'dim-header';
    hr1.appendChild(th);
  });
  const thMeas = document.createElement('th');
  thMeas.textContent = 'Measures — Quantity';
  thMeas.colSpan = _periods.length;
  hr1.appendChild(thMeas);

  // Row 2
  DIM_HEADERS.forEach(h => {
    const th = document.createElement('th');
    th.textContent = '';
    th.className = 'dim-header';
    hr2.appendChild(th);
  });
  _periods.forEach(p => {
    const th = document.createElement('th');
    th.textContent = p;
    hr2.appendChild(th);
  });

  // ── Body ──────────────────────────────────────────────────────
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  _rowGroups.forEach(group => {
    const tr = document.createElement('tr');

    // Frozen End highlight: if date is in the future relative to today
    const frozenDate = parseDate(group.frozen);
    const isFrozenActive = frozenDate && frozenDate >= new Date();

    // Dimension cells
    const dims = [
      { val: group.material, cls: 'material' },
      { val: group.fecha,    cls: 'date'     },
      { val: group.docDate,  cls: 'date'     },
      { val: group.frozen,   cls: `frozen${isFrozenActive ? ' frozen-active' : ''}` },
    ];
    dims.forEach(({ val, cls }) => {
      const td = document.createElement('td');
      td.className = `dim-cell ${cls}`;
      td.textContent = val || '—';
      tr.appendChild(td);
    });

    // Quantity cells per period
    _periods.forEach(p => {
      const cell = group.cells[p];
      const tdCell = document.createElement('td');
      tdCell.className = 'qty-cell';

      const inner = document.createElement('div');
      inner.className = 'qty-inner';

      if (!cell || cell.qty === null || cell.qty === undefined) {
        inner.textContent = '–';
        inner.classList.add('empty');
        inner.style.background = DEFAULT_BG;
        inner.style.color = DEFAULT_TEXT;
      } else {
        const qtyFormatted = typeof cell.qty === 'number'
          ? cell.qty.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 3 })
          : cell.qty;

        inner.textContent = qtyFormatted;
        inner.style.color      = TEXT_COLOR[cell.codTexto] ?? DEFAULT_TEXT;
        inner.style.background = BG_COLOR[cell.codFondo]   ?? DEFAULT_BG;

        // Tooltip
        inner.addEventListener('mouseenter', e => showTooltip(e, group, p, cell));
        inner.addEventListener('mousemove',  e => moveTooltip(e));
        inner.addEventListener('mouseleave', hideTooltip);
      }

      tdCell.appendChild(inner);
      tr.appendChild(tdCell);
    });

    tbody.appendChild(tr);
  });

  // Footer summary
  const colored = _rows.filter(r => r.codTexto || r.codFondo).length;
  document.getElementById('footerSummary').textContent =
    `${_rowGroups.length} filas · ${_periods.length} períodos · ${colored} celdas con código`;
}

// ═══════════════════════════════════════════════════════════════
//  DEMO DATA — shown at design time (no binding connected)
// ═══════════════════════════════════════════════════════════════

function loadDemoData() {
  const rows = [
    // ES/TH1088 — Fecha 01.11.2025
    { material:'ES/TH1088', fecha:'01.11.2025', docDate:'25.10.2025', frozen:'Apr 25, 2026', yearMonth:'September 2025', qty:null,   codTexto:'',  codFondo:'4'  },
    { material:'ES/TH1088', fecha:'01.11.2025', docDate:'25.10.2025', frozen:'Apr 25, 2026', yearMonth:'November 2025',  qty:10342,  codTexto:'1', codFondo:''   },
    { material:'ES/TH1088', fecha:'01.11.2025', docDate:'25.10.2025', frozen:'Apr 25, 2026', yearMonth:'September 2026', qty:null,   codTexto:'',  codFondo:''   },

    // ES/TH1089 — Fecha 15.09.2025
    { material:'ES/TH1089', fecha:'15.09.2025', docDate:'01.02.2025', frozen:'Apr 25, 2026', yearMonth:'September 2025', qty:19500,  codTexto:'3', codFondo:'2'  },
    { material:'ES/TH1089', fecha:'15.09.2025', docDate:'01.02.2025', frozen:'Apr 25, 2026', yearMonth:'November 2025',  qty:null,   codTexto:'',  codFondo:''   },
    { material:'ES/TH1089', fecha:'15.09.2025', docDate:'01.02.2025', frozen:'Apr 25, 2026', yearMonth:'September 2026', qty:null,   codTexto:'',  codFondo:''   },

    // ES/TH1089 — Fecha 01.09.2026 (segunda fila del mismo material)
    { material:'ES/TH1089', fecha:'01.09.2026', docDate:'15.10.2025', frozen:'Mar 26, 2026', yearMonth:'September 2025', qty:null,   codTexto:'',  codFondo:''   },
    { material:'ES/TH1089', fecha:'01.09.2026', docDate:'15.10.2025', frozen:'Mar 26, 2026', yearMonth:'November 2025',  qty:null,   codTexto:'',  codFondo:''   },
    { material:'ES/TH1089', fecha:'01.09.2026', docDate:'15.10.2025', frozen:'Mar 26, 2026', yearMonth:'September 2026', qty:20897,  codTexto:'2', codFondo:'4'  },
  ];

  processRows(rows);
  renderTable();
}

// ═══════════════════════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════════════════════

const tooltip = document.getElementById('tooltip');

function showTooltip(e, group, period, cell) {
  const txtLabel = cell.codTexto ? `Código ${cell.codTexto}` : 'Sin código';
  const bgLabel  = cell.codFondo ? `Código ${cell.codFondo}` : 'Sin código';
  const txtClass = { '1':'tt-red', '2':'tt-blue', '3':'tt-green' }[cell.codTexto] ?? 'tt-gray';
  const bgClass  = cell.codFondo ? (cell.codFondo === '4' ? 'tt-red' : 'tt-gray') : 'tt-gray';

  const qty = typeof cell.qty === 'number'
    ? cell.qty.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 3 })
    : cell.qty;

  tooltip.innerHTML = `
    <div class="tt-title">${group.material} · ${period}</div>
    <div class="tt-row"><span class="tt-label">Quantity</span><span class="tt-value">${qty}</span></div>
    <div class="tt-row"><span class="tt-label">Fecha Entrega</span><span class="tt-value">${group.fecha || '—'}</span></div>
    <div class="tt-row"><span class="tt-label">Frozen End</span><span class="tt-value">${group.frozen || '—'}</span></div>
    <div class="tt-row"><span class="tt-label">Cód. Texto</span><span class="tt-value ${txtClass}">${txtLabel}</span></div>
    <div class="tt-row"><span class="tt-label">Cód. Fondo</span><span class="tt-value ${bgClass}">${bgLabel}</span></div>
  `;
  tooltip.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e) {
  const x = e.clientX + 16, y = e.clientY - 10;
  tooltip.style.left = Math.min(x, window.innerWidth - 300) + 'px';
  tooltip.style.top  = Math.max(y, 8) + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════

function parseDate(str) {
  if (!str) return null;
  // Handles "Apr 25, 2026" and "DD.MM.YYYY"
  const d = new Date(str);
  if (!isNaN(d)) return d;
  const parts = str.split('.');
  if (parts.length === 3) return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
  return null;
}

function showState(msg, isError) {
  const el = document.getElementById('stateMsg');
  el.textContent = msg;
  el.className = 'state-msg' + (isError ? ' error' : '');
  el.style.display = 'flex';
  document.getElementById('tableWrapper').style.display = 'none';
}
function hideState() {
  document.getElementById('stateMsg').style.display = 'none';
  document.getElementById('tableWrapper').style.display = '';
}

loadDemoData();
